<h2>Company Dashboard</h2>

<a href="/company/create_drive">Create New Drive</a>
<a href="/logout">Logout</a>

<hr>

<h3>Your Drives</h3>

<table border="1">
<tr>
    <th>Drive Name</th>
    <th>Status</th>
    <th>Applications</th>
    <th>Actions</th>
</tr>

{% for job in jobs %}
<tr>
    <td>{{ job.drive_name }}</td>
    <td>{{ job.status }}</td>
    <td>{{ job.applications|length }}</td>
    <td>
        <a href="/company/view_applications/{{ job.id }}">View Applications</a>
        {% if job.status != "Closed" %}
            <a href="/company/close_drive/{{ job.id }}">Close</a>
        {% endif %}
    </td>
</tr>
{% endfor %}

</table>
