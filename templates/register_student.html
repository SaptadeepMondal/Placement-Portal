<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Matching Login Page Gradient */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            margin: 0;
        }

        .reg-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            width: 100%;
            max-width: 650px; /* Matched to Company Registration width */
        }

        .header-section {
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            /* Kept the green theme from the company page for total consistency */
            background: linear-gradient(135deg, #f9a470 0%, #bc556f 100%); 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: white;
            font-size: 1.25rem;
            box-shadow: 0 8px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .form-label {
            font-weight: 500;
            font-size: 0.85rem;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }

        .btn-register {
            background: linear-gradient(135deg, #f9a470 0%, #bc556f 100%);
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
            color: white;
        }

        .input-group-text {
            background: transparent;
            border-right: none;
            color: #9ca3af;
            border-radius: 12px 0 0 12px;
        }

        .has-icon .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #10b981;
        }

        .section-divider {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #9ca3af;
            margin: 1.5rem 0 1rem;
            display: flex;
            align-items: center;
        }

        .section-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="reg-card">
        
        <div class="header-section text-center">
            <div class="logo-icon">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h3 class="fw-bold text-dark">Student Registration</h3>
            <p class="text-muted small">Join our community to access exclusive placements</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category in ['success', 'danger', 'warning', 'info'] else 'info' }} border-0 py-2 small shadow-sm mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <div class="row">

                <div class="col-md-12 mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Student Email</label>
                    <input type="email" name="email" class="form-control" placeholder="john@university.edu" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="col-md-12 section-divider">Academic Profile</div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Current Education</label>
                    <div class="input-group has-icon">
                        <span class="input-group-text"><i class="fa-solid fa-graduation-cap"></i></span>
                        <input type="text" name="education" class="form-control" placeholder="e.g. B.Tech Computer Science">
                    </div>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Technical Skills</label>
                    <textarea name="skills" class="form-control" rows="2" placeholder="e.g. Python, SQL, Project Management..."></textarea>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">Upload Resume (PDF)</label>
                    <div class="input-group has-icon">
                        <span class="input-group-text"><i class="fa-solid fa-file-pdf"></i></span>
                        <input type="file" name="resume" class="form-control">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-register w-100">
                Register as Student
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="back-link">
                <i class="fa-solid fa-arrow-left me-1 small"></i> Already registered? Log in
            </a>
        </div>
    </div>
</div>

</body>
</html>
