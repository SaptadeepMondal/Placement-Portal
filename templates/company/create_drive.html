<h2>Create Placement Drive</h2>

<form method="POST">
    <input type="text" name="drive_name" placeholder="Drive Name" required><br>
    <input type="text" name="title" placeholder="Job Title" required><br>
    <input type="text" name="eligibility" placeholder="Eligibility"><br>
    <input type="text" name="salary" placeholder="Salary"><br>
    <input type="text" name="location" placeholder="Location"><br>
    <input type="date" name="deadline"><br>
    <textarea name="description" placeholder="Description"></textarea><br>

    <button type="submit">Create</button>
</form>
