<!DOCTYPE html>
<html>
<head>
    <title>Placement Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="height:100vh;">
        <div class="col-md-5">

            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Placement Portal Login</h3>


                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category in ['success', 'danger', 'warning', 'info'] else 'warning' }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email / Username</label>
                        <input type="text" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-1">New Student?</p>
                    <a href="/register/student" class="btn btn-outline-primary btn-sm w-100 mb-2">
                        Register as Student
                    </a>

                    <p class="mb-1">Company Registration</p>
                    <a href="/register/company" class="btn btn-outline-success btn-sm w-100">
                        Register as Company
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
